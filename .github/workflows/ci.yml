name: StashKit CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout StashKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned LoonKit production baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: YohakuSama/loonkit
          ref: 5f272104fc1207612c1cbd18f3e19d861d459ed9
          path: upstream/loonkit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run routing and validation regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify all sources, routing, YAML and rule assets
        run: python scripts/verify.py
      - name: Check reproducible rule generation without writing
        run: python scripts/build_rules.py --check
      - name: Probe encrypted bootstrap DoH over certificate-verified HTTPS
        run: python scripts/test_dns_endpoint.py
      - name: Verify candidate remote rule URLs and bytes before merge
        if: github.event_name == 'pull_request'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_remote.py --ref "$CANDIDATE_SHA"
      - name: Verify all published remote rule URLs and bytes
        if: github.ref == 'refs/heads/main'
        run: python scripts/check_remote.py
      - name: Generate self-contained local rule resource bundle
        run: python scripts/build_offline_bundle.py --output dist/StashKit-v0.1.3-offline.zip
      - name: Upload offline resource archive
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StashKit-v0.1.3-offline
          path: dist/StashKit-v0.1.3-offline.zip
          if-no-files-found: error
          retention-days: 90
