# StashKit v0.1.8 — local rule providers
mode: rule
log-level: warning

dns:
  # IP-literal DoH avoids a bootstrap DNS lookup.
  default-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
  # Resolve proxy hostnames independently of outbound DNS policy.
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver-policy:
    'rule-set:Private-local': system
    '+.local': system
    '+.lan': system
    '+.home.arpa': system
  follow-rule: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - 'rule-set:Private-local'
    - 'localhost'
    - '+.local'
    - '+.lan'
    - '+.home.arpa'
    - 'captive.apple.com'
    - 'dns.msftncsi.com'
    - 'dns.msftconnecttest.com'
    - '*.n.n.srv.nintendo.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'

proxy-groups:
  - name: "Proxy"
    type: select
    include-all: true
    # Initial selection is REJECT until a node is configured.
    proxies:
      - REJECT
    icon: https://raw.githubusercontent.com/YohakuSama/stashkit/3778671c7d4141ac49d734a8dfd45452a5147949/icons/Proxy.png
  - name: "Auto"
    type: url-test
    include-all: true
    proxies:
      - REJECT
    interval: 600
    tolerance: 60
    icon: https://raw.githubusercontent.com/YohakuSama/stashkit/3778671c7d4141ac49d734a8dfd45452a5147949/icons/Auto.png
  - name: "Fallback"
    type: fallback
    include-all: true
    proxies:
      - REJECT
    interval: 900
    icon: https://raw.githubusercontent.com/YohakuSama/stashkit/3778671c7d4141ac49d734a8dfd45452a5147949/icons/Fallback.png
  - name: "AdBlock"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"
      - "Proxy"
    icon: https://raw.githubusercontent.com/YohakuSama/stashkit/3778671c7d4141ac49d734a8dfd45452a5147949/icons/AdBlock.png
  - name: "Final"
