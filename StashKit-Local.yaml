# StashKit v0.1.3 — LOCAL/OFFLINE rule providers: place rules/ in Stash managed resource directory
# Requires Stash iOS/tvOS 3.6+ or macOS 4.3+ for encrypted DNS bootstrap.
# No nodes or private subscription URLs are bundled. Apply your own proxy-provider via an Override.
# Routing assets are generated Stash-native snapshots in this repository.
mode: rule
log-level: warning

dns:
  # Bootstrap the DoH hostname through encrypted DNS; direct encrypted DNS is not VPN tunneling.
  # Use an IP-literal endpoint to avoid a DNS-bootstrap cycle.
  default-nameserver:
    - https://223.5.5.5/dns-query
  # App/host DNS is handled by Stash Fake-IP. The resolver itself is direct,
  # not automatically tunneled through a proxy; see README privacy notes.
  nameserver:
    - https://dns.alidns.com/dns-query
  # Resolve proxy-server hostnames independently, avoiding proxy/DNS recursion.
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  # Private names need the LAN/system resolver; public names still use DoH.
  nameserver-policy:
    'geosite:private': system
    '+.local': system
    '+.lan': system
    '+.home.arpa': system
  follow-rule: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - 'geosite:private'
    - 'localhost'
    - '+.local'
    - '+.lan'
    - '+.home.arpa'
    - 'captive.apple.com'
    - 'dns.msftncsi.com'
    - 'dns.msftconnecttest.com'
    - '*.n.n.srv.nintendo.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'

proxy-groups:
  - name: "Proxy"
    type: select
    # Fail closed until the user explicitly selects a valid node pool.
    # Empty remote providers may be substituted with DIRECT by Stash.
    proxies:
      - REJECT
      - Auto
      - Fallback
      - ALL
  - name: "Auto"
    type: url-test
    include-all: true
    proxies:
      - REJECT
    interval: 600
    tolerance: 60
  - name: "Fallback"
    type: fallback
    include-all: true
    proxies:
      - REJECT
    interval: 900
  - name: ALL
    type: select
    include-all: true
    proxies:
      - REJECT
  - name: "AdBlock"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"
      - "Proxy"
