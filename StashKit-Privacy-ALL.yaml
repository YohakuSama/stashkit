# StashKit v0.1.22 — privacy DNS — legacy ALL compatibility
mode: rule
log-level: warning
dns:
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  nameserver-policy:
    rule-set:Private-local: system
    +.local: system
    +.lan: system
    +.home.arpa: system
  follow-rule: true
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - rule-set:Private-local
  - localhost
  - +.local
  - +.lan
  - +.home.arpa
  - captive.apple.com
  - dns.msftncsi.com
  - dns.msftconnecttest.com
  - '*.n.n.srv.nintendo.net'
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Auto
  - Fallback
  - ALL
  - REJECT
  icon: https://raw.githubusercontent.com/YohakuSama/stashkit/20c801ef91c4395a1535c3bd83c51034c0a3648f/icons/Proxy.png
- name: Auto
